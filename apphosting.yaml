# Firebase App Hosting.
#
# App Hosting builds this repository from GitHub on every push to the connected
# branch and serves it on Cloud Run behind a Google-managed domain and
# certificate. It detects Next.js on its own, so there is no build command here.
#
# The app root is the REPOSITORY ROOT. package.json, next.config.ts and this
# file all live at the top level; there is no subdirectory to point at.
#
# Almost nothing needs configuring:
#
#   - The Firebase Web config (API key, auth domain, project, app id) is handed
#     to the build by App Hosting as FIREBASE_WEBAPP_CONFIG, and next.config.ts
#     maps it onto the NEXT_PUBLIC_ names the browser reads. Nothing to copy.
#   - The server's project id comes from GOOGLE_CLOUD_PROJECT, which Cloud Run
#     sets. Nothing to copy.
#   - Firebase access comes from the service account this runs as, through
#     Application Default Credentials. There is no service account key file, and
#     there should not be: it is a long-lived secret that need not exist.
#
# What is left is one optional secret, for the background worker.

runConfig:
  # Rendering a bill's PDF starts a real Chromium inside this container. It
  # needs the memory and the CPU to be worth having; 512MiB is not enough for a
  # browser, and the render will be killed rather than slow.
  memoryMiB: 1024
  cpu: 1
  # A cold instance unpacks Chromium before its first PDF. That is seconds, not
  # milliseconds, so a request must be allowed to outlive the default.
  timeoutSeconds: 120
  # A PDF render is heavy and holds a browser. Twenty at once per instance is
  # deliberate; the default of eighty would queue renders behind each other.
  concurrency: 20
  # Scale to zero. A very small business bills a few times a day, and an idle
  # instance is a bill for nothing.
  minInstances: 0
  maxInstances: 4

env:
  # --- the Firebase Web app -------------------------------------------------
  #
  # These four are public by design. The browser is handed all of them on every
  # page load: they identify the project, they do not authorise anything, and
  # every Firestore read and write goes through this app's own server because
  # firestore.rules denies direct client access outright.
  #
  # App Hosting also describes its Web App to the server as
  # FIREBASE_WEBAPP_CONFIG, and the app falls back to that. They are set
  # explicitly here anyway: an explicit value wins, and sign-in then does not
  # depend on whether a platform variable turned up.
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: ekbill
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: ekbill.firebaseapp.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyDcmIdVh3AIAtG3EbIX-ZkhGOEJJKUDo7o
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:286759361840:web:c7582d023b21502e8e3cf5"
    availability: [BUILD, RUNTIME]

  # Storage, Messaging and Analytics appear in the console's snippet and are
  # deliberately absent here: this app uses none of them. Analytics in
  # particular would send a record of every screen an owner opens to Google,
  # from an app whose fonts are self-hosted precisely so that opening a bill
  # tells no third party anything.

  # Which Firestore database to use. Unset means the project's `(default)`.
  #
  # A database's LOCATION IS FIXED AT CREATION and can never be changed. If the
  # default one was created in the wrong region -- nam5 is the United States;
  # asia-south1 is Mumbai -- the way out is to create a second database in the
  # right region and name it here, then move any data across. Every read this
  # app makes happens before a page renders, so the round trip to the database
  # is in front of the owner on every screen.
  #
  # - variable: FIRESTORE_DATABASE_ID
  #   value: easybills-india
  #   availability: [RUNTIME]

  # ===========================================================================
  # SIGN-IN IS SWITCHED OFF.
  #
  # With this set to "true" there is no sign-in at all. Everyone who opens the
  # address is the same test user, and can read every bill, issue new ones and
  # record payments against them. The app says so in red on every screen.
  #
  # It is on because it was asked for, to look at the app without setting up
  # Firebase Auth first. It must come off before a real business's books go in.
  #
  # To turn sign-in back on: set this to "false" (or delete these three lines),
  # commit, push. Then in Firebase Console > Authentication > Sign-in method,
  # enable Email/Password, and Google if you want that button to work.
  #
  # The test user's data is its own demo business, flagged as sample records,
  # so nothing real is mixed into it.
  # ===========================================================================
  - variable: AUTH_BYPASS
    value: "true"
    availability: [RUNTIME]

  # Five days. An owner billing from a shared shop counter should not stay
  # signed in for a month.
  - variable: SESSION_MAX_AGE_MS
    value: "432000000"
    availability: [RUNTIME]

  # The shared secret the background job runner must present. Cloud Scheduler
  # sends it; without it nothing can drain the queue, and monthly drafts are
  # never prepared.
  #
  # Deliberately commented out rather than required. A backend that refuses to
  # start because a secret for a background job is missing is worse than one
  # that bills correctly while that job waits -- and Business details reports
  # "Monthly drafts: not configured" either way, so this cannot be forgotten
  # quietly. Create it, then uncomment:
  #
  #   openssl rand -hex 32
  #   firebase apphosting:secrets:set job-runner-secret --project ekbill
  #   firebase apphosting:secrets:grantaccess job-runner-secret \
  #     --project ekbill --backend easybills
  #
  # - variable: JOB_RUNNER_SECRET
  #   secret: job-runner-secret
  #   availability: [RUNTIME]

  # --- the assistant --------------------------------------------------------
  #
  # The app is fully usable with this off, and off is the default: the bill
  # editor is the product, and "speak or type your bill" is a shortcut into it.
  #
  # The API key NEVER goes in this file, in the console's environment-variable
  # form, or in .env. Those are all read by anyone who can read the repository
  # or open the console. It goes in Secret Manager:
  #
  #   firebase apphosting:secrets:set ai-llm-api-key
  #   firebase apphosting:secrets:grantaccess ai-llm-api-key --backend easybills
  #
  # then uncomment the four lines below and set AI_ENABLED to "true". The key
  # is read into the server process at boot and is never sent to the browser --
  # every model call is made server-side, by design.
  - variable: AI_ENABLED
    value: "false"
    availability: [RUNTIME]
  # - variable: AI_LLM_PROVIDER
  #   value: anthropic          # anthropic | openai | google
  #   availability: [RUNTIME]
  # - variable: AI_LLM_MODEL
  #   value: claude-sonnet-5
  #   availability: [RUNTIME]
  # - variable: AI_LLM_API_KEY
  #   secret: ai-llm-api-key
  #   availability: [RUNTIME]
  #
  # Voice is a separate provider and a separate key, because transcription and
  # text generation are separate services. Leave it out and the microphone
  # button stays hidden rather than failing when tapped.
  # - variable: AI_TRANSCRIPTION_PROVIDER
  #   value: openai
  #   availability: [RUNTIME]
  # - variable: AI_TRANSCRIPTION_API_KEY
  #   secret: ai-transcription-api-key
  #   availability: [RUNTIME]

  # --- connected GST filing -------------------------------------------------
  # Stays off. It needs a GSP contract, and the tax rule pack still ships
  # unverified -- read docs/compliance/README.md before changing this.
  - variable: GSP_MODE
    value: "off"
    availability: [RUNTIME]
