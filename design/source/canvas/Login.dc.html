<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<title>EkBill · Login</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#16170F;text-decoration:none}a:hover{color:#000}
.dot{font-family:'Urbanist',system-ui,sans-serif;font-weight:500;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
input:focus{outline:2px solid #16170F;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; font-family: 'Urbanist', system-ui, sans-serif; color: #16170F; background-color: #EEEEEA; background-image: radial-gradient(rgba(22,23,15,.07) 1px, transparent 1.3px); background-size: 9px 9px; display: flex; flex-direction: column">

  <!-- hero -->
  <section style="position: relative; margin: 12px 12px 0; height: 400px; border-radius: 36px; overflow: hidden; color: #FFFFFF; background: radial-gradient(90% 60% at 100% 0%, #6B1F08 0%, rgba(107,31,8,0) 60%), radial-gradient(70% 55% at 10% 100%, #FFE2B8 0%, rgba(255,226,184,0) 70%), radial-gradient(60% 50% at 95% 85%, #C9C3F3 0%, rgba(201,195,243,0) 70%), linear-gradient(168deg, #8A2C0B 0%, #C2410C 34%, #F2762E 64%, #FFA95C 88%, #FFE0BD 100%)">
    <svg aria-hidden="true" viewBox="0 0 366 200" style="position: absolute; left: 0; bottom: 30px; width: 100%; opacity: .45; fill: none; stroke: #FFFFFF; stroke-width: .8"><path d="M0 120 C60 70 120 170 190 110 S310 60 366 120"/><path d="M0 132 C70 92 130 180 200 122 S320 84 366 134"/><path d="M0 108 C50 74 120 150 175 98 S290 48 366 104"/><path d="M0 144 C80 116 140 186 210 136 S320 110 366 146"/></svg>
    <div style="position: relative; display: flex; justify-content: space-between; align-items: center; padding: 22px 22px 0">
      <div style="display: flex; align-items: center; gap: 10px">
        <div aria-hidden="true" style="width: 36px; height: 36px; border-radius: 12px; background: rgba(255,255,255,.92); display: grid; place-items: center"><span class="dot" style="color: #16170F; font-size: 17px; line-height: 1">e₹</span></div>
        <span style="font-size: 18px; font-weight: 600">EkBill</span>
      </div>
      <span class="dot" style="font-size: 12px; font-weight: 700; letter-spacing: .08em; opacity: .9">V 1.0</span>
    </div>
    <h1 style="position: relative; margin: 46px 22px 0; font-size: 40px; line-height: 1.04; font-weight: 300; letter-spacing: -.03em">Bill banao.<br>WhatsApp karo.<br><span style="font-weight: 600">Paise lo.</span></h1>
    <!-- floating mini card -->
    <div aria-hidden="true" style="position: absolute; right: 18px; bottom: 22px; width: 168px; padding: 14px 14px 12px; border-radius: 24px; background: rgba(255,255,255,.88); color: #16170F; box-shadow: 0 18px 30px -18px rgba(0,0,0,.45); backdrop-filter: blur(10px)">
      <div style="display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 500">INV-043<span style="width: 22px; height: 22px; border-radius: 50%; background: #FFB020; display: grid; place-items: center"><svg class="ico" viewBox="0 0 24 24" style="width: 12px; height: 12px; stroke-width: 2.4"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span></div>
      <div style="display: flex; align-items: baseline; gap: 1px; margin-top: 8px"><span style="font-size: 16px; font-weight: 300">₹</span><span class="dot" style="font-size: 28px; line-height: 1">6,200</span></div>
      <div style="font-size: 11px; color: #5F6057; margin-top: 4px">Mehta Traders · Aa gaye</div>
    </div>
  </section>

  <!-- form -->
  <form style="flex: 1; display: flex; flex-direction: column; padding: 26px 22px 30px">
    <h2 style="margin: 0; font-size: 24px; font-weight: 300; letter-spacing: -.02em">Apna <span style="font-weight: 600">number</span> daalo</h2>
    <p style="margin: 6px 0 18px; font-size: 14px; color: #5F6057">Password ki zaroorat nahi. Bas ek code.</p>

    <label for="ph" style="font-size: 12px; font-weight: 600; color: #45463E; letter-spacing: .02em">Phone number</label>
    <div style="display: flex; align-items: center; gap: 10px; margin-top: 6px; height: 56px; padding: 0 8px 0 16px; border-radius: 20px; background: #FFFFFF; box-shadow: inset 0 0 0 1px #E2E1DA">
      <span style="font-size: 16px; font-weight: 600">+91</span>
      <span aria-hidden="true" style="width: 1px; height: 22px; background: #E2E1DA"></span>
      <input id="ph" type="tel" inputmode="numeric" value="98220 12345" style="flex: 1; min-width: 0; border: 0; background: transparent; font: 500 17px 'Urbanist', sans-serif; color: #16170F; letter-spacing: .02em">
      <span style="font-size: 12px; font-weight: 600; color: #1E6B3A; display: inline-flex; align-items: center; gap: 4px; padding: 6px 10px; border-radius: 999px; background: #E2F1DF"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width: 12px; height: 12px; stroke-width: 2.4"><path d="M5 12.5l4.5 4.5L19 7"/></svg>Code gaya</span>
    </div>

    <fieldset style="border: 0; margin: 20px 0 0; padding: 0">
      <legend style="font-size: 12px; font-weight: 600; color: #45463E; letter-spacing: .02em; padding: 0">6-digit code</legend>
      <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; margin-top: 8px">
        <input aria-label="Digit 1" class="dot" value="4" maxlength="1" style="height: 58px; width: 100%; box-sizing: border-box; text-align: center; border: 0; border-radius: 18px; background: #FFFFFF; box-shadow: inset 0 0 0 1px #E2E1DA; font-size: 28px; color: #16170F">
        <input aria-label="Digit 2" class="dot" value="8" maxlength="1" style="height: 58px; width: 100%; box-sizing: border-box; text-align: center; border: 0; border-radius: 18px; background: #FFFFFF; box-shadow: inset 0 0 0 1px #E2E1DA; font-size: 28px; color: #16170F">
        <input aria-label="Digit 3" class="dot" value="1" maxlength="1" style="height: 58px; width: 100%; box-sizing: border-box; text-align: center; border: 0; border-radius: 18px; background: #FFFFFF; box-shadow: inset 0 0 0 1px #E2E1DA; font-size: 28px; color: #16170F">
        <input aria-label="Digit 4" class="dot" value="" maxlength="1" style="height: 58px; width: 100%; box-sizing: border-box; text-align: center; border: 0; border-radius: 18px; background: #FFFFFF; box-shadow: inset 0 0 0 2px #16170F; font-size: 28px; color: #16170F">
        <input aria-label="Digit 5" class="dot" value="" maxlength="1" style="height: 58px; width: 100%; box-sizing: border-box; text-align: center; border: 0; border-radius: 18px; background: rgba(255,255,255,.6); box-shadow: inset 0 0 0 1px #E2E1DA; font-size: 28px; color: #16170F">
        <input aria-label="Digit 6" class="dot" value="" maxlength="1" style="height: 58px; width: 100%; box-sizing: border-box; text-align: center; border: 0; border-radius: 18px; background: rgba(255,255,255,.6); box-shadow: inset 0 0 0 1px #E2E1DA; font-size: 28px; color: #16170F">
      </div>
    </fieldset>
    <p style="margin: 12px 0 0; font-size: 13px; color: #5F6057; display: flex; align-items: center; gap: 6px"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width: 15px; height: 15px"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>SMS se code aayega · <span class="dot" style="font-size: 14px; color: #16170F">0:24</span> mein dobara bhejo</p>

    <a href="Main.dc.html" style="margin-top: auto; display: flex; align-items: center; justify-content: space-between; height: 60px; padding: 0 8px 0 24px; border-radius: 999px; background: #16170F; color: #FFFFFF; font-size: 17px; font-weight: 600">Aage chalo
      <span style="width: 46px; height: 46px; border-radius: 50%; background: #FFB020; color: #16170F; display: grid; place-items: center"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a>
  </form>
</div>
</x-dc>

</body>
</html>
