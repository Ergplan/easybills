<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<title>EkBill · Naya bill</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#16170F;text-decoration:none}a:hover{color:#000}
.dot{font-family:'Urbanist',system-ui,sans-serif;font-weight:500;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.fld{width:100%;box-sizing:border-box;height:48px;padding:0 14px;border:0;border-radius:16px;background:#F4F4F0;font:500 15px 'Urbanist',sans-serif;color:#16170F}
.fld:focus{outline:2px solid #16170F;outline-offset:1px;background:#FFFFFF}
.lbl{display:block;font-size:12px;font-weight:600;color:#5F6057;margin:0 0 6px 2px}
</style>
</helmet>
<div style="width: 390px; height: 1120px; position: relative; overflow: hidden; box-sizing: border-box; font-family: 'Urbanist', system-ui, sans-serif; color: #16170F; background-color: #EEEEEA; background-image: radial-gradient(rgba(22,23,15,.07) 1px, transparent 1.3px); background-size: 9px 9px">

  <!-- header -->
  <header style="display: flex; align-items: center; gap: 12px; padding: 22px 18px 0">
    <a href="Main.dc.html" aria-label="Back to home" style="width: 46px; height: 46px; border-radius: 50%; background: rgba(255,255,255,.85); display: grid; place-items: center; flex: none">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></a>
    <div style="flex: 1; min-width: 0">
      <h1 style="margin: 0; font-size: 22px; line-height: 1.15; font-weight: 300; letter-spacing: -.02em"><span style="font-weight: 600">Mehta Traders</span> ka bill</h1>
      <p style="margin: 2px 0 0; font-size: 13px; color: #5F6057">INV-043 · aaj, 26 Sep</p>
    </div>
    <span aria-hidden="true" style="width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 16px; background: linear-gradient(140deg, #FFE6C7, #FDB27A); flex: none">M</span>
  </header>

  <main style="display: flex; flex-direction: column; gap: 12px; padding: 20px 12px 0">

    <!-- same as last time -->
    <section aria-labelledby="pj" style="position: relative; border-radius: 30px; padding: 20px 18px 18px; overflow: hidden; background: radial-gradient(80% 60% at 100% 0%, rgba(255,255,255,.85) 0%, rgba(255,255,255,0) 70%), linear-gradient(165deg, #A7A3EC 0%, #DAD5F8 34%, #F6F0F8 64%, #EFC6E7 100%); box-shadow: 0 22px 36px -28px rgba(120,80,170,.7)">
      <div style="display: flex; align-items: center; gap: 8px">
        <span aria-hidden="true" style="width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,.75); display: grid; place-items: center"><svg class="ico" viewBox="0 0 24 24" style="width: 16px; height: 16px"><path d="M4 12a8 8 0 1 0 2.3-5.6M4 4v4h4"/></svg></span>
        <h2 id="pj" style="margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -.01em">Pichle jaisa hi?</h2>
      </div>
      <p style="margin: 10px 0 14px; font-size: 14px; color: #3B3C34">Aug ka bill: AMC visit + 2 fans · <span class="num" style="font-weight: 600">₹6,200</span></p>
      <div style="display: flex; gap: 8px">
        <button type="button" onClick="{{ fillLast }}" style="flex: 1; height: 46px; border: 0; border-radius: 999px; background: {{ lastBg }}; color: #16170F; font: 600 14px 'Urbanist', sans-serif; display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer">{{ lastLabel }}</button>
        <button type="button" onClick="{{ clearAll }}" style="height: 46px; padding: 0 18px; border: 0; border-radius: 999px; background: rgba(255,255,255,.75); color: #16170F; font: 500 14px 'Urbanist', sans-serif; cursor: pointer">Naya likho</button>
      </div>
    </section>

    <!-- items -->
    <section aria-label="Kaam ki list" style="display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{ items }}" as="item" hint-placeholder-count="2">
        <div style="border-radius: 28px; padding: 16px 16px 16px; background: #FFFFFF; box-shadow: 0 1px 0 rgba(0,0,0,.03), 0 18px 30px -26px rgba(22,23,15,.35)">
          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px">
            <span class="dot" style="font-size: 13px; font-weight: 700; letter-spacing: .08em; color: #5F6057">KAAM {{ item.n }}</span>
            <button type="button" aria-label="Remove item" onClick="{{ item.remove }}" style="width: 36px; height: 36px; border: 0; border-radius: 50%; background: #F4F4F0; color: #5F6057; display: grid; place-items: center; cursor: pointer"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
          </div>
          <label class="lbl" for="d{{ $index }}">Kya kiya?</label>
          <input id="d{{ $index }}" class="fld" value="{{ item.d }}" onChange="{{ item.onD }}" placeholder="Jaise: AMC visit, wiring, fan install">
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 10px; align-items: end">
            <div><label class="lbl" for="q{{ $index }}">Kitna</label><input id="q{{ $index }}" class="fld num" inputmode="numeric" value="{{ item.q }}" onChange="{{ item.onQ }}"></div>
            <div><label class="lbl" for="r{{ $index }}">Rate (₹)</label><input id="r{{ $index }}" class="fld num" inputmode="numeric" value="{{ item.r }}" onChange="{{ item.onR }}"></div>
            <div style="height: 48px; display: flex; flex-direction: column; justify-content: center; align-items: flex-end; padding-right: 4px"><span style="font-size: 11px; color: #5F6057">Rakam</span><span class="num" style="font-size: 17px; font-weight: 600">₹{{ item.amt }}</span></div>
          </div>
        </div>
      </sc-for>
      <button type="button" onClick="{{ addItem }}" style="height: 54px; border-radius: 22px; border: 1.5px dashed #B9B8AE; background: rgba(255,255,255,.45); color: #16170F; font: 600 15px 'Urbanist', sans-serif; display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px; stroke-width: 2"><path d="M12 5v14M5 12h14"/></svg>Aur kaam jodo</button>
    </section>

    <!-- total -->
    <section aria-label="Total" style="border-radius: 30px; padding: 20px 20px 18px; background: #FFFFFF; box-shadow: 0 1px 0 rgba(0,0,0,.03), 0 18px 30px -26px rgba(22,23,15,.35)">
      <div style="display: flex; justify-content: space-between; align-items: flex-end">
        <div>
          <div style="font-size: 14px; color: #5F6057">Total</div>
          <div style="display: flex; align-items: baseline; gap: 2px; margin-top: 4px"><span style="font-size: 24px; font-weight: 300">₹</span><span class="dot" style="font-size: 44px; line-height: 1">{{ totalStr }}</span></div>
        </div>
        <span style="font-size: 12px; color: #5F6057; text-align: right">{{ countStr }}</span>
      </div>
      <p style="display: flex; align-items: center; gap: 8px; margin: 16px 0 0; padding: 10px 12px; border-radius: 16px; background: #F4F4F0; font-size: 13px; color: #3B3C34">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px; flex: none"><circle cx="12" cy="12" r="8"/><path d="M4 12h16M12 4c2.5 2.5 2.5 13.5 0 16M12 4c-2.5 2.5-2.5 13.5 0 16"/></svg>
        Bill English mein banega, customer ke liye.</p>
    </section>
  </main>

  <!-- CTA -->
  <div style="position: absolute; left: 12px; right: 12px; bottom: 24px">
    <a href="BillDone.dc.html" style="display: flex; align-items: center; justify-content: space-between; height: 62px; padding: 0 8px 0 24px; border-radius: 999px; background: #FFB020; font-size: 17px; font-weight: 600; box-shadow: 0 20px 30px -18px rgba(200,110,10,.7)">
      <span>Bill banao · <span class="num">₹{{ totalStr }}</span></span>
      <span style="width: 48px; height: 48px; border-radius: 50%; background: #16170F; color: #FFB020; display: grid; place-items: center"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1120}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filled: true, items: Component.last() };
  }
  static last() {
    return [
      { d: 'AMC visit — September', q: '1', r: '3500' },
      { d: 'Ceiling fan install', q: '2', r: '1350' }
    ];
  }
  patch(i, key, e) {
    const items = this.state.items.slice();
    items[i] = Object.assign({}, items[i], { [key]: e.target.value });
    this.setState({ items: items, filled: false });
  }
  renderVals() {
    const fmt = (n) => Math.round(n).toLocaleString('en-IN');
    const items = this.state.items.map((it, i) => {
      const amt = (parseFloat(it.q) || 0) * (parseFloat(String(it.r).replace(/,/g, '')) || 0);
      return Object.assign({}, it, {
        n: String(i + 1).padStart(2, '0'),
        amt: fmt(amt),
        raw: amt,
        onD: (e) => this.patch(i, 'd', e),
        onQ: (e) => this.patch(i, 'q', e),
        onR: (e) => this.patch(i, 'r', e),
        remove: () => this.setState({ items: this.state.items.filter((_, j) => j !== i), filled: false })
      });
    });
    const total = items.reduce((s, it) => s + it.raw, 0);
    return {
      items: items,
      totalStr: fmt(total),
      countStr: items.length + (items.length === 1 ? ' kaam' : ' kaam') ,
      lastLabel: this.state.filled ? '✓ Bhar diya' : 'Haan, wahi bharo',
      lastBg: this.state.filled ? '#FFFFFF' : '#FFB020',
      fillLast: () => this.setState({ filled: true, items: Component.last() }),
      clearAll: () => this.setState({ filled: false, items: [{ d: '', q: '1', r: '' }] }),
      addItem: () => this.setState({ items: this.state.items.concat([{ d: '', q: '1', r: '' }]) })
    };
  }
}
</script>
</body>
</html>
